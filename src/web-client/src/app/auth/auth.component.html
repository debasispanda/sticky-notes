<mat-card>
  <mat-card-title>Login</mat-card-title>
  <mat-card-content>
    <form [formGroup]="form" id="loginForm" (ngSubmit)="submit()">
      <p *ngIf="error" class="error">
        {{ error }}
      </p>
      <mat-form-field>
        <input type="text" matInput placeholder="Username" formControlName="username">
      </mat-form-field>
      <mat-form-field>
        <input type="password" matInput placeholder="Password" formControlName="password">
      </mat-form-field>
    </form>
    </mat-card-content>
    <mat-card-actions>
      <div class="button">
      <button type="submit" form="loginForm" mat-button>Login</button>
      </div>
  </mat-card-actions>
</mat-card>
